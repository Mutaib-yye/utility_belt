         Sessions issued by the previous backend can never be refreshed by the

         drafts and consent all survive. */
      (function () {

          var REF = "irlerugcdvzopptzmnbt";
          var stale = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);

            var isAuth = (k.indexOf("sb-") === 0 && k.indexOf("-auth-token") > -1) || k.indexOf("supabase.auth") > -1;
            if (isAuth && k.indexOf(REF) === -1) stale.push(k);
